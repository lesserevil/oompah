name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

jobs:
  test:
    # GitHub-hosted runners are the primary CI capacity.  The equivalent
    # dedicated-runner workflow remains available for operator-dispatched
    # verification without making public-runner availability a hard requirement
    # for local validation.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      OOMPAH_PYTEST_WORKERS: "2"

    steps:
      - uses: actions/checkout@v4
        with:
          # Protected pull-request evidence must attest the immutable review
          # head, not GitHub's synthetic merge revision.  Other workflow
          # events continue to check out their ordinary triggering SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Provision OS sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap iproute2
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if test -e /proc/sys/kernel/unprivileged_userns_clone; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          bwrap \
            --die-with-parent \
            --new-session \
            --unshare-user \
            --unshare-pid \
            --unshare-net \
            --clearenv \
            --tmpfs / \
            --dir /usr \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin \
            --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 \
            --dev /dev \
            --proc /proc \
            /bin/true

          bwrap \
            --die-with-parent \
            --new-session \
            --unshare-user \
            --unshare-pid \
            --unshare-net \
            --cap-add CAP_NET_ADMIN \
            --proc /proc \
            --dev /dev \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin \
            --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 \
            /bin/sh -c 'ip link show lo >/dev/null 2>&1'

      - name: Configure Git identity
        run: |
          git config --global user.name oompah
          git config --global user.email lesserevil@users.noreply.github.com

      - name: Create supported test environment
        run: |
          python -m pip install --upgrade pip uv
          make test-setup

      - name: Run tests
        run: make test
