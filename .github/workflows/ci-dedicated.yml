name: CI (Dedicated Runner)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux, x64, oompah]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node.js runtime
        run: |
          node -e 'const major=Number(process.versions.node.split(".")[0]); if (major < 20) process.exit(1); const assert=require("node:assert/strict"); assert.equal(major >= 20, true)'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          OOMPAH_VALIDATION_RESOURCE_DB: ${{ vars.OOMPAH_VALIDATION_RESOURCE_DB || '/home/shedwards/src/oompah/.oompah/validation_resources.sqlite3' }}
          OOMPAH_CI_PROJECT_ID: ${{ vars.OOMPAH_CI_PROJECT_ID || 'proj-14849f1b' }}
        run: |
          test -f "$OOMPAH_VALIDATION_RESOURCE_DB"
          test "$(id -u)" -eq 0
          test "$(id -u nobody)" -ne 0
          python scripts/ci-dedicated-broker.py \
            --lease-db "$OOMPAH_VALIDATION_RESOURCE_DB" \
            --artifact-dir "$RUNNER_TEMP/oompah-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.python-version }}" \
            --project-id "$OOMPAH_CI_PROJECT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-id "${GITHUB_JOB}:python-${{ matrix.python-version }}" \
            --run-as "$(id -u nobody):$(stat -c %g "$GITHUB_WORKSPACE")" \
            --timeout-seconds 3600 \
            tests/ -n 4 --dist loadgroup --max-worker-restart=0

      - name: Upload complete test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-dedicated-${{ github.run_id }}-${{ github.run_attempt }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/oompah-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}
          if-no-files-found: error
          retention-days: 14
